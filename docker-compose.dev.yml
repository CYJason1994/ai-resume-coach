# M0 最小可跑闭环：Postgres(pgvector) + Redis(ARQ) + api + web + worker
# 不含 MinIO/OCR（独立 profile，见 compose.prod.yml）
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_coach"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/resume_coach
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://web:3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-v4-flash}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-deepseek-embedding}
      JOB_SOURCE: ${JOB_SOURCE:-onet}
      STORAGE_LOCAL_DIR: /app/data/uploads
      ONET_SNAPSHOT_PATH: /app/data/jobs/onet/snapshot.json
      CURATED_JOBS_DIR: /app/data/jobs/curated
      ZH_OVERLAY_PATH: /app/data/jobs/zh_overlay.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 3001

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/resume_coach
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-v4-flash}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-deepseek-embedding}
      STORAGE_LOCAL_DIR: /app/data/uploads
      ONET_SNAPSHOT_PATH: /app/data/jobs/onet/snapshot.json
      CURATED_JOBS_DIR: /app/data/jobs/curated
      ZH_OVERLAY_PATH: /app/data/jobs/zh_overlay.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
    command: python -m app.workers.worker

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
