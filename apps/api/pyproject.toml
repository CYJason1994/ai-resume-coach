[project]
name = "ai-resume-coach-api"
version = "0.3.0"
description = "ai-resume-coach 后端（FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "arq>=0.28",
    "redis>=5.0",
    "alembic>=1.14",
    "psycopg>=2.9",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "pdfminer.six>=20221105",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
