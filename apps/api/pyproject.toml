[project]
name = "ai-resume-coach-api"
version = "0.3.0"
description = "ai-resume-coach 后端（FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "arq>=0.28",
    "redis>=5.0",
    "alembic>=1.14",
    "psycopg>=2.9",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "sentry-sdk>=2.0,<3.0",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.41,<1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
    "pdfminer.six>=20221105",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# M4 遗留3 收口：mypy 硬门禁（ci.yml `mypy app`，P2-8 已去 `|| true`）。
# 第三方无类型标注库按 Any 静默处理（聚焦一方 app 代码的类型正确性），
# 避免分析其源码/缺失 stub 造成的噪声失败，使门禁真正可过且有意义。
[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
no_implicit_optional = true
